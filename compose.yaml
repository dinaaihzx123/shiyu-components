# 拾语 · Linux NAS 单容器配置
# 在本文件旁放置 .env 和 data/，按随附发行说明填写固定镜像。
name: shiyu-rust
services:
  shiyu:
    image: ${SHIYU_IMAGE:?请在.env中填写已导入或已发布的固定镜像}
    container_name: shiyu-core
    restart: unless-stopped
    network_mode: host
    environment:
      SHIYU_LISTEN: ${SHIYU_BIND_IP:-127.0.0.1}:${SHIYU_HTTP_PORT:-18930}
      SHIYU_MEMORY_MB: "${SHIYU_MEMORY_MB:-768}"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${SHIYU_DATA_DIR:-./data}
        target: /data
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,size=32m,mode=0755
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    mem_limit: ${SHIYU_MEMORY_MB:-768}m
    mem_reservation: 256m
    memswap_limit: ${SHIYU_MEMORY_MB:-768}m
    cpus: ${SHIYU_CPUS:-2.0}
    pids_limit: 128
    oom_score_adj: 500
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID, KILL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 70s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
